name: Release APK

# Builds the debug APK on a GitHub-hosted runner (which has the Android SDK and
# can reach Google's Maven + the MMD artifact) and attaches it to a prerelease.
# Triggered by pushing a tag like `v0.1.0-alpha`, or manually.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/MindfulAnki-${GITHUB_REF_NAME}.apk"

      # Always upload build output so logs/APK are retrievable even if the
      # release step is skipped (e.g. manual run without a tag).
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mindfulanki-apk
          path: out/*.apk

      - name: Publish prerelease
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: "MindfulAnki ${{ github.ref_name }}"
          files: out/*.apk
          body: |
            Automated prerelease build of the MindfulAnki debug APK.

            ⚠️ Unsigned debug build for sideloading/testing only. Install with
            `adb install MindfulAnki-${{ github.ref_name }}.apk` or transfer to
            the Mudita Kompakt and open it.
